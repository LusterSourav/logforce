# Manual instant deploy for Vercel plus Render
# Skips all idle checks and ships now. Use from Actions tab Run workflow.
# Successful run records SHA so hourly ticks suspend till new commits.
name: Deploy Now Manual
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Platform to ship to'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - vercel
          - render
concurrency:
  group: deploy-sync
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      HEAD_SHA: ${{ github.sha }}
      TARGET: ${{ inputs.target }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      # Checkout needed so the tracker tag can move at the end
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Require hook secrets
        run: |
          if [ "$TARGET" != "render" ] && [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then echo "Add VERCEL_DEPLOY_HOOK_URL secret first."; exit 1; fi
          if [ "$TARGET" != "vercel" ] && [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then echo "Add RENDER_DEPLOY_HOOK_URL secret first."; exit 1; fi
      # Fire Vercel hook for current HEAD in one call
      - name: Fire Vercel deploy hook
        if: inputs.target != 'render'
        run: |
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" -o /dev/null
          echo "Vercel build triggered for $HEAD_SHA."
      # Fire Render hook for current HEAD in one call
      - name: Fire Render deploy hook
        if: inputs.target != 'vercel'
        run: |
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" -o /dev/null
          echo "Render build triggered for $HEAD_SHA."
      # Poll Render until live build commit equals HEAD
      - name: Verify Render is live on HEAD
        if: inputs.target != 'vercel' && env.RENDER_API_KEY != ''
        run: |
          for i in $(seq 1 40); do
            INFO=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1")
            LINE=$(echo "$INFO" | python3 -c "import sys,json; d=json.load(sys.stdin); items=d.get('deploys',d) if isinstance(d,dict) else d; f=items[0].get('deploy',items[0]); print(f['status']+' '+f['commit']['id'])")
            echo "try $i render $LINE"
            STATUS=$(echo "$LINE" | cut -d' ' -f1)
            COMMIT=$(echo "$LINE" | cut -d' ' -f2)
            if [ "$STATUS" = "live" ] && [ "$COMMIT" = "$HEAD_SHA" ]; then exit 0; fi
            if [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "update_failed" ]; then echo "Render build failed."; exit 1; fi
            sleep 15
          done
          echo "Render verify timed out."
          exit 1
      # Poll Vercel until READY build commit equals HEAD
      - name: Verify Vercel is ready on HEAD
        if: inputs.target != 'render' && env.VERCEL_TOKEN != ''
        run: |
          for i in $(seq 1 20); do
            INFO=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=10")
            LINE=$(echo "$INFO" | python3 -c "import sys,json; d=json.load(sys.stdin); ds=[x for x in d.get('deployments',[]) if x.get('target')=='production']; f=ds[0] if ds else d.get('deployments',[{}])[0]; print(str(f.get('state'))+' '+str((f.get('meta') or {}).get('githubCommitSha')))")
            echo "try $i vercel $LINE"
            STATE=$(echo "$LINE" | cut -d' ' -f1)
            COMMIT=$(echo "$LINE" | cut -d' ' -f2)
            if [ "$STATE" = "READY" ] && [ "$COMMIT" = "$HEAD_SHA" ]; then exit 0; fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then echo "Vercel build failed."; exit 1; fi
            sleep 15
          done
          echo "Vercel verify timed out."
          exit 1
      # Confirm chosen public URLs answer after green API checks
      - name: Confirm public URLs answer
        run: |
          if [ "$TARGET" != "render" ]; then
            for i in $(seq 1 6); do
              A=$(curl -s -o /dev/null -w "%{http_code}" https://logforce.vercel.app || true)
              if [ "$A" = "200" ]; then break; fi
              if [ "$i" = "6" ]; then echo "Vercel URL check failed."; exit 1; fi
              sleep 10
            done
          fi
          if [ "$TARGET" != "vercel" ]; then
            for i in $(seq 1 6); do
              B=$(curl -s -o /dev/null -w "%{http_code}" https://logforce.onrender.com || true)
              if [ "$B" = "200" ]; then break; fi
              if [ "$i" = "6" ]; then echo "Render URL check failed."; exit 1; fi
              sleep 10
            done
          fi
          echo "Public URLs answer."
      # Move tracker tag so hourly ticks suspend till new commits
      - name: Move tracker tag to shipped HEAD
        run: |
          git tag -f last-shipped "$HEAD_SHA"
          git push --force origin tag last-shipped
          echo "Tracker tag now at $HEAD_SHA."
