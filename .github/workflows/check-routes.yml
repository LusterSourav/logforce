# Route guard: every local page or asset linked from ui/*.html must resolve
# on Vercel through either a vercel.json rewrite or a static file path.
# Catches the /team.html class of 404 before it ships.
name: Check Routes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit ui links against vercel routes
        run: python3 - <<'EOF'
        import json, re, sys
        from pathlib import Path
        vercel = json.loads(Path('vercel.json').read_text())
        routes = {r['source'] for r in vercel.get('rewrites', [])}
        static = {'/'}
        for p in Path('.').rglob('*'):
            if '.git' in p.parts or '.vercel' in p.parts:
                continue
            if p.is_file():
                static.add('/' + p.as_posix())
        errs = []
        pages = sorted(Path('ui').glob('*.html'))
        link_re = re.compile(r'''(?<![\w-])(?:href|src)\s*=\s*["']([^"'#]+)["']''')
        for page in pages:
            for m in link_re.finditer(page.read_text()):
                link = m.group(1).strip().split('?')[0]
                if not link or link.startswith(('http://', 'https://', 'mailto:', 'data:', '//')):
                    continue
                cands = [link] if link.startswith('/') else ['/' + link, '/ui/' + link]
                if not any(c in routes or c in static or c.startswith('/api/') for c in cands):
                    errs.append(f'{page.name} links {link} with no vercel route or static file')
        if errs:
            print('\n'.join(errs))
            sys.exit(1)
        print(f'routes ok: {len(pages)} pages checked')
        EOF
