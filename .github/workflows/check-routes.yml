# Route guard. Every local page or asset linked from ui html files must resolve
# on Vercel through either a vercel rewrite or a static file path.
# Catches the team page class of 404 before it ships.
name: Check Routes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit ui links against vercel routes
        run: python3 .github/workflows/check_routes.py
