<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Not found · LogForce</title>
<style>
  html,body{ margin:0; padding:0; height:100%; }
  body{ background:#000; overflow:hidden; font-family:Helvetica,Arial,system-ui,sans-serif; }
  .fof{ margin:10px 0; }
  .fof canvas{
    position:relative; width:100%; height:100%; margin-bottom:20px; z-index:1;
    background:#000; display:block;
  }
  .msg{
    position:fixed; bottom:4%; left:50%; transform:translateX(-50%); z-index:2;
    background:rgba(20,20,20,.82); color:#fff; border:1px solid rgba(255,255,255,.22);
    padding:1rem 1.4rem; max-width:min(92vw,430px); text-align:center; border-radius:12px;
  }
  .eyebrow{ font-size:.68rem; letter-spacing:.18em; text-transform:uppercase; opacity:.55; margin:0 0 .3rem; }
  .msg h1{ font-size:1.3rem; margin:0 0 .4rem; }
  .msg p{ font-size:.82rem; line-height:1.5; margin:.35rem 0; opacity:.85; }
  .actions{ display:flex; gap:.5rem; justify-content:center; flex-wrap:wrap; margin-top:.7rem; }
  .actions a{
    font-size:.78rem; text-decoration:none; padding:.45rem .9rem; border-radius:8px;
    border:1px solid #fff; color:#fff;
    transition:transform .18s ease,background .18s ease,color .18s ease;
  }
  .actions a:hover{ transform:translateY(-2px); }
  .actions a.primary{ background:#fff; color:#000; }
  @media (prefers-reduced-motion:reduce){ .actions a{ transition:none; } }
</style>
</head>
<body>
<div class="fof"><canvas></canvas></div>
<div class="msg" role="alert">
  <p class="eyebrow">HTTP 404 · Not found</p>
  <h1>Nothing here is watching back</h1>
  <p>This path doesn't exist on LogForce. The eyes followed you here anyway.</p>
  <div class="actions">
    <a class="primary" href="dashboard-v2.html">Back to dashboard</a>
    <a href="docs.html">Docs</a>
    <a href="team.html">Request access</a>
  </div>
</div>
<script>
// The 404 eyes, after Hakim El Hattab's hakkm.se/404. Canvas 2D, no
// dependencies. Ported: rAF shim dropped (universal now), rebuild-on-
// resize added (source never resized), pointermove covers touch drag,
// reduced-motion renders one static frame.
(function(){
  var DISPLAY_WIDTH = window.innerWidth,
      DISPLAY_HEIGHT = window.innerHeight,
      DISPLAY_DURATION = 10;

  var mouse = { x: DISPLAY_WIDTH / 2, y: DISPLAY_HEIGHT / 2 },
      container, canvas, context, startTime, eyes;

  // x, y, scale, activation-time — 18 watchers plus the big central eye.
  var EYE_DEFS = [
    [0.19,0.80,0.88,0.31],[0.10,0.54,0.84,0.32],[0.81,0.13,0.63,0.33],
    [0.89,0.19,0.58,0.34],[0.40,0.08,0.97,0.35],[0.64,0.74,0.57,0.36],
    [0.41,0.89,0.56,0.37],[0.92,0.89,0.75,0.38],[0.27,0.20,0.87,0.39],
    [0.17,0.46,0.68,0.41],[0.71,0.29,0.93,0.42],[0.84,0.46,0.54,0.43],
    [0.93,0.35,0.63,0.44],[0.77,0.82,0.85,0.45],[0.36,0.74,0.90,0.46],
    [0.13,0.24,0.85,0.47],[0.58,0.20,0.77,0.48],[0.55,0.84,0.87,0.50],
    [0.50,0.50,5.00,0.10]
  ];

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function buildEyes(){
    eyes = EYE_DEFS.map(function(d){ return new Eye(canvas, d[0], d[1], d[2], d[3]); });
  }

  function initialize(){
    container = document.querySelector('.fof');
    canvas = document.querySelector('.fof>canvas');
    if(!canvas) return;
    canvas.width = DISPLAY_WIDTH;
    canvas.height = DISPLAY_HEIGHT;
    context = canvas.getContext('2d');
    window.addEventListener('pointermove', function(event){
      mouse.x = event.clientX;
      mouse.y = event.clientY;
    }, false);
    var resizeTimer;
    window.addEventListener('resize', function(){
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function(){
        DISPLAY_WIDTH = window.innerWidth;
        DISPLAY_HEIGHT = window.innerHeight;
        canvas.width = DISPLAY_WIDTH;
        canvas.height = DISPLAY_HEIGHT;
        buildEyes();
        startTime = Date.now();
      }, 200);
    });
    buildEyes();
    startTime = Date.now();
    if(reduceMotion){
      eyes.forEach(function(eye){ eye.activate(); eye.exposure.current = 1; eye.update(mouse); });
      return;
    }
    animate();
  }

  function animate(){
    var seconds = (Date.now() - startTime) / 1000;
    context.clearRect(0, 0, DISPLAY_WIDTH, DISPLAY_HEIGHT);
    for(var i = 0, len = eyes.length; i < len; i++){
      var eye = eyes[i];
      if(seconds > eye.activationTime * DISPLAY_DURATION) eye.activate();
      eye.update(mouse);
    }
    requestAnimationFrame(animate);
  }

  initialize();
})();

function Eye(canvas, x, y, scale, time){
  this.canvas = canvas;
  this.context = this.canvas.getContext('2d');
  this.activationTime = time;
  this.irisSpeed = 0.01 + (Math.random() * 0.2) / scale;
  this.blinkSpeed = 0.2 + (Math.random() * 0.2);
  this.blinkInterval = 5000 + 5000 * (Math.random());
  this.blinkTime = Date.now();
  this.scale = scale;
  this.size = 70 * scale;
  this.x = x * canvas.width;
  this.y = y * canvas.height + (this.size * 0.15);
  this.iris = { x: this.x, y: this.y - (this.size * 0.1), size: this.size * 0.2 };
  this.pupil = { width: 2 * scale, height: this.iris.size * 0.75 };
  this.exposure = {
    top: 0.1 + (Math.random() * 0.3),
    bottom: 0.5 + (Math.random() * 0.3),
    current: 0, target: 1
  };
  this.tiredness = (0.5 - this.exposure.top) + 0.1;
  this.isActive = false;
  this.activate = function(){ this.isActive = true; };
  this.update = function(mouse){ if(this.isActive === true) this.render(mouse); };
  this.render = function(mouse){
    var time = Date.now();
    if(this.exposure.current < 0.012) this.exposure.target = 1;
    else if(time - this.blinkTime > this.blinkInterval){
      this.exposure.target = 0;
      this.blinkTime = time;
    }
    this.exposure.current += (this.exposure.target - this.exposure.current) * this.blinkSpeed;
    var el = { x: this.x - (this.size * 0.8), y: this.y - (this.size * 0.1) };
    var er = { x: this.x + (this.size * 0.8), y: this.y - (this.size * 0.1) };
    var et = { x: this.x, y: this.y - (this.size * (0.5 + (this.exposure.top * this.exposure.current))) };
    var eb = { x: this.x, y: this.y - (this.size * (0.5 - (this.exposure.bottom * this.exposure.current))) };
    var eit = { x: this.x, y: this.y - (this.size * (0.5 + ((0.5 - this.tiredness) * this.exposure.current))) };
    var ei = { x: this.x, y: this.y - (this.iris.size) };
    var eio = {
      x: (mouse.x - ei.x) / (window.innerWidth - ei.x),
      y: (mouse.y) / (window.innerHeight)
    };
    ei.x += eio.x * 16 * Math.max(1, this.scale * 0.4);
    ei.y += eio.y * 10 * Math.max(1, this.scale * 0.4);
    this.iris.x += (ei.x - this.iris.x) * this.irisSpeed;
    this.iris.y += (ei.y - this.iris.y) * this.irisSpeed;
    this.context.fillStyle = 'rgba(255,255,255,1.0)';
    this.context.strokeStyle = 'rgba(100,100,100,1.0)';
    this.context.beginPath();
    this.context.lineWidth = 3;
    this.context.lineJoin = 'round';
    this.context.moveTo(el.x, el.y);
    this.context.quadraticCurveTo(et.x, et.y, er.x, er.y);
    this.context.quadraticCurveTo(eb.x, eb.y, el.x, el.y);
    this.context.closePath();
    this.context.stroke();
    this.context.fill();
    this.context.save();
    this.context.globalCompositeOperation = 'source-atop';
    this.context.translate(this.iris.x*0.1, 0);
    this.context.scale(0.9, 1);
    this.context.strokeStyle = 'rgba(0,0,0,0.5)';
    this.context.fillStyle = 'rgba(130,50,90,0.9)';
    this.context.lineWidth = 2;
    this.context.beginPath();
    this.context.arc(this.iris.x, this.iris.y, this.iris.size, 0, Math.PI*2, true);
    this.context.fill();
    this.context.stroke();
    this.context.restore();
    this.context.save();
    this.context.shadowColor = 'rgba(255,255,255,0.5)';
    this.context.shadowOffsetX = 0;
    this.context.shadowOffsetY = 0;
    this.context.shadowBlur = 2 * this.scale;
    this.context.globalCompositeOperation = 'source-atop';
    this.context.translate(this.iris.x*0.1, 0);
    this.context.scale(0.9, 1);
    this.context.fillStyle = 'rgba(255,255,255,0.2)';
    this.context.beginPath();
    this.context.arc(this.iris.x, this.iris.y, this.iris.size * 0.7, 0, Math.PI*2, true);
    this.context.fill();
    this.context.restore();
    this.context.save();
    this.context.globalCompositeOperation = 'source-atop';
    this.context.fillStyle = 'rgba(0,0,0,0.9)';
    this.context.beginPath();
    this.context.moveTo(this.iris.x, this.iris.y - (this.pupil.height * 0.5));
    this.context.quadraticCurveTo(this.iris.x + (this.pupil.width * 0.5), this.iris.y, this.iris.x, this.iris.y + (this.pupil.height * 0.5));
    this.context.quadraticCurveTo(this.iris.x - (this.pupil.width * 0.5), this.iris.y, this.iris.x, this.iris.y - (this.pupil.height * 0.5));
    this.context.fill();
    this.context.restore();
    this.context.save();
    this.context.shadowColor = 'rgba(0,0,0,0.9)';
    this.context.shadowOffsetX = 0;
    this.context.shadowOffsetY = 0;
    this.context.shadowBlur = 10;
    this.context.fillStyle = 'rgba(120,120,120,0.2)';
    this.context.beginPath();
    this.context.moveTo(el.x, el.y);
    this.context.quadraticCurveTo(et.x, et.y, er.x, er.y);
    this.context.quadraticCurveTo(eit.x, eit.y, el.x, el.y);
    this.context.closePath();
    this.context.fill();
    this.context.restore();
  };
}
</script>
</body>
</html>
