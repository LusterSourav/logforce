# vector.toml
# Perimeter ingestion for ULPF. One file in, one NDJSON out.
# Vector watches the device log, VRL normalizes to OCSF 4001, file sink appends.
# All device specifics live in Phase 1 of the VRL file. Everything after that stays generic.
# This keeps new devices to a single regex change instead of a pipeline rewrite.

# Env you must export before running. Vector will expand them.
#   PERIMETER_LOG_PATH   path Vector tails. Dev uses logs/perimeter.log. Prod uses /var/log/perimeter.log
#   PERIMETER_SINK_PATH  NDJSON output with strftime. Example output/normalized/perimeter-%Y-%m-%d.ndjson
#   VECTOR_DATA_DIR      checkpoint dir for file offsets. Default vector_data
# Run checks without env
#   vector validate --no-environment ingestion/vector.toml
#   vector test ingestion/vector.toml tests/test_normalize_perimeter.yaml

timezone = "UTC"

# Checkpoint dir. Vector reads VECTOR_DATA_DIR env to override this at runtime.
# No restart needed when you move the directory. Just export and relaunch.
data_dir = "vector_data"

# File source. Tails any perimeter log you point it at.
[sources.perimeter_raw]
type = "file"
include = ["${PERIMETER_LOG_PATH}"]
read_from = "beginning"
glob_minimum_cooldown_ms = 1000

# Glue for Java or Kotlin stack traces. If a line starts with whitespace and
# looks like a stack frame, it joins the previous event instead of becoming its own.
# Turn this off if your device never emits multi line traces.
[sources.perimeter_raw.multiline]
mode = "continue_through"
condition_pattern = '^\s+at\s+|^Caused by:|^.*Exception:'
start_pattern = '^\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\.\d+'
timeout_ms = 1000

# Backpressure handling. When the downstream VRL or sink stalls, this buffers
# to disk up to 2 GB instead of dropping events. Block means stall, not loss.
# This is what makes air gapped replay safe after a restart.
[sources.perimeter_raw.buffer]
type = "disk"
max_size = 2147483648
when_full = "block"

# VRL normalizer. One remap that does all the work.
# The file path is relative to repo root when you run from repo root.
[transforms.perimeter_normalized]
type = "remap"
inputs = ["perimeter_raw"]
file = "ingestion/transforms/normalize_perimeter.vrl"
drop_on_abort = true
drop_on_error = true

# Primary sink. Append only NDJSON. Date rolls via strftime in PERIMETER_SINK_PATH.
[sinks.perimeter_ocsf_file]
type = "file"
inputs = ["perimeter_normalized"]
path = "${PERIMETER_SINK_PATH}"

[sinks.perimeter_ocsf_file.encoding]
codec = "json"

[sinks.perimeter_ocsf_file.framing]
method = "newline_delimited"

# Small memory buffer in front of the file sink. Keeps tail latency flat
# when many events arrive at once. Block again, do not drop.
[sinks.perimeter_ocsf_file.buffer]
type = "memory"
max_events = 500
when_full = "block"

# Second sink. Push normalized NDJSON to the Go API which writes to Postgres and Parquet.
# This is the C path that makes Vector → Postgres → DataFusion real.
[sinks.search_indexer]
type = "http"
inputs = ["perimeter_normalized"]
uri = "http://ulpf-server:8081/api/ingest"
encoding.codec = "json"
framing.method = "newline_delimited"
request.retry_attempts = 5
request.retry_backoff_secs = 2
healthcheck.enabled = false
batch.max_events = 100
batch.timeout_secs = 2

