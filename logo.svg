<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Main Cyan-to-Blue-to-Indigo Neon Gradient -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0052ff" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Symmetrical Reflection Gradient -->
    <linearGradient id="cyberGradRev" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0052ff" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0052ff" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for Bold Elevation -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambientLight" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="800" height="800" rx="48" fill="url(#bgGlow)" />

  <!-- Subtle Symmetrical Background Geometric Grid Circles -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <circle cx="400" cy="360" r="280" stroke-dasharray="6 8" />
    <circle cx="400" cy="360" r="210" />
    <circle cx="400" cy="360" r="140" stroke-dasharray="4 6" />
    <line x1="400" y1="80" x2="400" y2="640" stroke-dasharray="4 4" />
    <line x1="120" y1="360" x2="680" y2="360" stroke-dasharray="4 4" />
  </g>

  <!-- Center Ambient Radial Glow -->
  <circle cx="400" cy="360" r="180" fill="url(#neonGlow)" filter="url(#ambientLight)" />

  <!-- ================= SYMMETRICAL EMBLEM (ULPF MESH / FLOW / INFINITY POD) ================= -->
  <g id="symmetrical-emblem" filter="url(#softGlow)">
    <!-- Outer Curvy Symmetrical Shield / Infinity Loop Ribbon -->
    <!-- Left Wing / Petal (Curvy & Bold) -->
    <path d="M 400,160 
             C 310,160 210,210 180,290 
             C 146,380 180,480 270,510 
             C 340,534 380,460 400,410 
             C 380,360 330,340 300,350 
             C 265,362 250,395 250,420 
             C 250,370 280,300 350,270 
             C 380,256 395,230 400,210 Z" 
          fill="url(#cyberGrad)" />

    <!-- Right Wing / Petal (Symmetrical Reflection) -->
    <path d="M 400,160 
             C 490,160 590,210 620,290 
             C 654,380 620,480 530,510 
             C 460,534 420,460 400,410 
             C 420,360 470,340 500,350 
             C 535,362 550,395 550,420 
             C 550,370 520,300 450,270 
             C 420,256 405,230 400,210 Z" 
          fill="url(#cyberGradRev)" />

    <!-- Inner Continuous Curvy Flow Bridge (Symmetric Waveform Ribbons) -->
    <path d="M 400,240
             C 350,240 300,275 285,325
             C 270,375 295,425 340,435
             C 385,445 400,390 400,360
             C 400,390 415,445 460,435
             C 505,425 530,375 515,325
             C 500,275 450,240 400,240 Z"
          fill="none" 
          stroke="url(#cyberGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Central Symmetrical Energy Diamond / Core Node -->
    <g transform="translate(400, 360)">
      <path d="M 0,-36 C 16,-12 28,0 36,0 C 28,0 16,12 0,36 C -16,12 -28,0 -36,0 C -28,0 -16,-12 0,-36 Z" 
            fill="#ffffff" />
      <circle cx="0" cy="0" r="10" fill="#0052ff" />
      <circle cx="0" cy="0" r="5" fill="#38bdf8" />
    </g>

    <!-- Top & Bottom Harmonic Accent Nodes -->
    <circle cx="400" cy="160" r="10" fill="#38bdf8" />
    <circle cx="400" cy="160" r="5" fill="#ffffff" />

    <circle cx="400" cy="510" r="8" fill="#a855f7" />
    <circle cx="400" cy="510" r="4" fill="#ffffff" />

    <!-- Graceful Dual Flow Echo Arcs -->
    <path d="M 230,270 C 290,195 350,185 400,185 C 450,185 510,195 570,270" 
          fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <path d="M 270,510 C 330,540 370,545 400,545 C 430,545 470,540 530,510" 
          fill="none" stroke="#a855f7" stroke-width="6" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- ================= BOLD & AESTHETIC TYPOGRAPHY ================= -->
  <!-- Main Title: ULPF -->
  <text x="400" y="640" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="16" 
        fill="#ffffff">
    ULPF
  </text>

  <!-- High-Tech Subtitle & Descriptor -->
  <text x="400" y="675" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'SF Pro Text', 'Inter', monospace" 
        font-size="13" 
        font-weight="600" 
        letter-spacing="6" 
        fill="#38bdf8" 
        opacity="0.9">
    UNIVERSAL LOG PRE-PROCESSING FRAMEWORK
  </text>

  <!-- Symmetrical Micro Dot Decors -->
  <g fill="#6366f1" opacity="0.7">
    <circle cx="210" cy="671" r="3" />
    <circle cx="590" cy="671" r="3" />
  </g>
</svg>